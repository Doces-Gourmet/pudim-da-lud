<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozinha | Pudim da Lud</title><style>
body{margin:0;background:#f7efe2;color:#54270b;font-family:Arial,sans-serif}header{background:#54270b;color:white;padding:18px 5%;display:flex;justify-content:space-between}main{max-width:1000px;margin:25px auto;padding:0 16px}.order{background:#fff;border:1px solid #ead8bd;border-radius:16px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;border-bottom:1px solid #ead8bd;padding-bottom:10px}.item{display:flex;justify-content:space-between;padding:8px 0}button{padding:9px 12px;border:0;border-radius:7px;background:#54270b;color:white;cursor:pointer}.status{background:#e7d2aa;border:0;padding:9px;border-radius:8px}.print{float:right}</style></head><body><header><strong>👩‍🍳 Cozinha · Pudim da Lud</strong><a href="admin.html" style="color:#fff">ADM</a></header><main><h1>Pedidos para produção</h1><div id="lista"></div></main><script type="module">
import {configured,db,collection,getDocs,query,orderBy,updateDoc,doc} from "./firebase-app.js";
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v);
async function load(){let p=[];if(configured){const s=await getDocs(query(collection(db,"pedidos"),orderBy("criadoEm","desc")));p=s.docs.map(x=>({id:x.id,...x.data()}));}else p=JSON.parse(localStorage.getItem("pudim_pedidos")||"[]");p=p.filter(x=>x.status!=="Finalizado");lista.innerHTML=p.map(x=>'<article class="order"><div class="top"><strong>#'+(x.numero||x.id)+' · '+(x.nome||"Cliente")+'</strong><span>'+new Date(x.criadoEm?.seconds?x.criadoEm.seconds*1000:x.criadoEm).toLocaleString("pt-BR")+'</span></div><p><b>'+((x.tipo||"").toUpperCase())+'</b> · '+(x.whatsapp||"")+'</p>'+((x.endereco)?'<p>📍 '+x.endereco+' '+(x.bairro||"")+' '+(x.cidade||"")+'</p>':'')+'<div>'+((x.itens||[]).map(i=>'<div class="item"><span>'+i.q+'x '+i.name+' · '+i.s+'</span><b>'+money(i.price*i.q)+'</b></div>').join(""))+'</div><p><b>Total: '+money(x.total||0)+'</b></p><select class="status" onchange="status(\''+x.id+'\',this.value)"><option '+(x.status==="Recebido"?"selected":"")+' value="Recebido">Recebido</option><option '+(x.status==="Em produção"?"selected":"")+' value="Em produção">Em produção</option><option '+(x.status==="Pronto"?"selected":"")+' value="Pronto">Pronto</option><option '+(x.status==="Finalizado"?"selected":"")+' value="Finalizado">Finalizado</option></select> <button class="print" onclick="printOrder(\''+x.id+'\')">Imprimir</button></article>').join("")||"<p>Sem pedidos pendentes.</p>"}
window.status=async(id,value)=>{if(configured){await updateDoc(doc(db,"pedidos",id),{status:value})}else{const p=JSON.parse(localStorage.getItem("pudim_pedidos")||"[]");const x=p.find(x=>x.id===id);if(x)x.status=value;localStorage.setItem("pudim_pedidos",JSON.stringify(p))}load()};
window.printOrder=id=>{const el=document.querySelector('[onclick="printOrder(\\''+id+'\\')"]')?.closest(".order");if(el)window.print()};
load();
</script></body></html>
