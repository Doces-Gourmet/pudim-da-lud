<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM | Pudim da Lud</title><style>
body{margin:0;background:#fff8ee;color:#54270b;font-family:Arial,sans-serif;padding:30px}.box{max-width:1000px;margin:auto;background:#fffdf9;border:1px solid #ead8bd;border-radius:20px;padding:25px}input{padding:11px;border:1px solid #ead8bd;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#54270b;color:white;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric{padding:18px;border:1px solid #ead8bd;border-radius:12px;background:white}.metric b{display:block;font-size:25px;margin-top:8px}.order{padding:15px;border-bottom:1px solid #ead8bd}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}}</style></head><body><div class="box"><a href="index.html">← Voltar para a loja</a><div id="login"><h1>Área Administrativa</h1><p>Login de demonstração</p><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><p id="err"></p></div><div id="dash" style="display:none"><h1>Dashboard ADM</h1><div class="metrics"><div class="metric">Pedidos<b id="n">0</b></div><div class="metric">Faturamento<b id="f">R$ 0,00</b></div><div class="metric">Ticket médio<b id="t">R$ 0,00</b></div><div class="metric">Clientes<b id="c">0</b></div></div><h2>Pedidos</h2><div id="orders"></div><p><a href="index.html#cardapio">Cardápio</a> · Funcionários · Promoções · Cupons · Delivery · Cozinha (módulos planejados para a próxima fase)</p></div></div><script>const M=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);function login(){if(email.value==='admin@pudimdalud.com'&&pass.value==='123456'){login.style.display='none';dash.style.display='block';render()}else err.textContent='Login inválido.'}function render(){const p=JSON.parse(localStorage.getItem('pudim_pedidos')||'[]'),f=p.reduce((s,x)=>s+x.total,0);n.textContent=p.length;fEl=document.getElementById('f');fEl.textContent=M(f);t.textContent=M(p.length?f/p.length:0);c.textContent=new Set(p.map(x=>x.whatsapp)).size;orders.innerHTML=p.map(x=>'<div class="order"><b>#'+x.numero+'</b> — '+x.nome+' — '+M(x.total)+' — <strong>'+x.status+'</strong></div>').join('')||'<p>Nenhum pedido.</p>'}</script></body></html>
